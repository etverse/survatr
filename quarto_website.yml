project:
  type: website
  output-dir: ../docs/

execute:
  freeze: auto

website:
  title: "$ALTDOC_PACKAGE_NAME"
  favicon: man/figures/logo.png
  code-links: true
  navbar:
    # man/ (including man/figures/) is copied into the _quarto build dir by
    # altdoc's .import_man() before Quarto renders, so this path resolves from
    # the Quarto project root — the same reference the README image uses.
    logo: man/figures/logo.png
    search: true
    right:
      - icon: github
        href: $ALTDOC_PACKAGE_URL_GITHUB
        aria-label: $ALTDOC_PACKAGE_NAME GitHub
  sidebar:
    collapse-level: 1
    contents:
      - text: Home
        file: index.md
      - section: Getting started
        contents:
          - text: Introduction
            file: vignettes/survatr.qmd
      - section: Estimation methods
        contents:
          - text: "IPW (Track A)"
            file: vignettes/ipw.qmd
          - text: "ICE / longitudinal (Track B)"
            file: vignettes/ice.qmd
          - text: "Competing risks (CIF)"
            file: vignettes/competing-risks.qmd
      - section: $ALTDOC_MAN_BLOCK
      - text: News
        file: $ALTDOC_NEWS
      - text: Changelog
        file: $ALTDOC_CHANGELOG
      - text: License
        file: $ALTDOC_LICENSE
      - text: Licence
        file: $ALTDOC_LICENCE
      - text: Code of conduct
        file: $ALTDOC_CODE_OF_CONDUCT
      - text: Citation
        file: $ALTDOC_CITATION

format:
  html:
    code-link: true
    theme: lumen
    toc: true
    toc-depth: 3
